<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin IoT Stress Detection</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fc;
}

.navbar{
  width:100%;
  background:#1e293b;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.navbar button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:red;
  color:white;
  cursor:pointer;
}

.container{
  padding:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h3{
  margin-bottom:15px;
}

.card p{
  font-size:32px;
  font-weight:bold;
}

.form-card input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

.save-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.table-container{
  margin-top:30px;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#1e293b;
  color:white;
}

.normal{color:green;}
.ringan{color:orange;}
.berat{color:red;}
.online{color:green;}
.offline{color:red;}
</style>
</head>

<body>

<div class="navbar">
  <h2>Dashboard Admin IoT Stress Detection</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="cards">

<div class="card form-card">
<h3>Data Responden</h3>

<input type="text" id="nama" placeholder="Nama Mahasiswa">
<input type="number" id="umur" placeholder="Umur">
<input type="number" id="semester" placeholder="Semester">

<button class="save-btn" onclick="simpanData()">
Simpan Data
</button>
</div>

<div class="card">
<h3>Heart Rate Variability</h3>
<p id="hrv">0 ms</p>
</div>

<div class="card">
<h3>EDA / GSR Sensor</h3>
<p id="gsr">0 uS</p>
</div>

<div class="card">
<h3>Stress Level</h3>
<p id="status">-</p>
</div>

<div class="card">
<h3>Device Status</h3>
<p id="device">OFFLINE</p>
</div>

</div>

<div class="table-container">

<h3>Riwayat Pengukuran</h3>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Umur</th>
<th>Semester</th>
<th>HRV</th>
<th>EDA</th>
<th>Status</th>
<th>Waktu</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

</div>

</div>

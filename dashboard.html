<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fc;
    }

    .navbar{
      width:100%;
      background:#1e293b;
      color:white;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .navbar button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:red;
      color:white;
      cursor:pointer;
    }

    .container{
      padding:30px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card h3{
      margin-bottom:10px;
      color:#64748b;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
      color:#0f172a;
    }

  </style>
</head>
<body>

  <div class="navbar">

    <h2>Dashboard IoT</h2>

    <button onclick="logout()">
      Logout
    </button>

  </div>

  <div class="container">

  <div class="card">
  <h3>Heart Rate Variability</h3>
  <p id="hrv">0 ms</p>
</div>

<div class="card">
  <h3>EDA Sensor</h3>
  <p id="gsr">0 uS</p>
</div>

<div class="card">
  <h3>Stress Level</h3>
  <p id="status">-</p>
</div>

<div class="card">
  <h3>Device Status</h3>
  <p id="device">OFFLINE</p>
</div>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {

      apiKey: "AIzaSyARjdNZCCneCczefxSZ-sMDmNwzBITt93A",
      authDomain: "cobaiot-210cc.firebaseapp.com",
      projectId: "cobaiot-210cc",
      storageBucket: "cobaiot-210cc.firebasestorage.app",
      messagingSenderId: "839944267290",
      appId: "1:839944267290:web:14c33e950e30032abd13a3"

    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user)=>{

      if(!user){

        window.location.href = "index.html";

      }

    });

    window.logout = function(){

      signOut(auth)
      .then(()=>{

        alert("Logout berhasil");

        window.location.href = "index.html";

      });

    }

  </script>

</body>
</html>

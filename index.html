<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IoT Project - Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#1e3c72,#2a5298);
    }

    .container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .container h2{
      text-align:center;
      margin-bottom:25px;
      color:#1e3c72;
    }

    .input-group{
      margin-bottom:15px;
    }

    .input-group label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#1e3c72;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2a5298;
    }

    .link{
      text-align:center;
      margin-top:15px;
    }

    .link a{
      color:#1e3c72;
      text-decoration:none;
      font-weight:bold;
    }

    .message{
      text-align:center;
      margin-top:10px;
      color:red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Login IoT Project</h2>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Masukkan email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password">
    </div>

    <button onclick="login()">Login</button>

    <div class="link">
      Belum punya akun?
      <a href="register.html">Register</a>
    </div>

    <div class="message" id="loginMessage"></div>
  </div>

  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // CONFIG FIREBASE
    const firebaseConfig = {
  apiKey: "AIzaSyARjdNZCCneCczefxSZ-sMDmNwzBITt93A",
  authDomain: "cobaiot-210cc.firebaseapp.com",
  projectId: "cobaiot-210cc",
  storageBucket: "cobaiot-210cc.firebasestorage.app",
  messagingSenderId: "839944267290",
  appId: "1:839944267290:web:14c33e950e30032abd13a3",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = function(){

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      signInWithEmailAndPassword(auth, email, password)
      .then(() => {

        alert("Login berhasil");
        window.location.href = "dashboard.html";

      })
      .catch((error) => {

        document.getElementById("loginMessage").innerHTML =
        error.message;

      });
    }

  </script>

</body>
</html>
